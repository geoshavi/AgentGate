name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    # No provider secrets are configured for this job on purpose. The suite
    # never requires ANTHROPIC_API_KEY/OPENAI_API_KEY/GOOGLE_API_KEY: tests
    # that touch provider construction explicitly unset those variables
    # (see tests/test_eval_cli.py), and `.env` is gitignored so it is never
    # present on a fresh checkout. `engine bench --dry-run` below makes zero
    # LLM calls by construction (src/engine/eval/report.py).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest

      - name: engine bench --dry-run (offline CLI smoke check)
        run: engine bench --dry-run
